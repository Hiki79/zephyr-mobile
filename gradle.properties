# 4 GB, not 8: a GitHub-hosted runner has 7 GB in the smallest tier and the
# build is killed outright when the daemon plus the Kotlin daemon overcommit.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Left off deliberately: the signing config reads environment variables at
# configuration time, and a cached configuration would hide a changed key.
org.gradle.configuration-cache=false

kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official
