name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned by commit, not by tag: a tag can be moved to
# point at different code, a commit cannot.
jobs:
  core:
    name: Core (mihomo arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.27.1"
          # go.sum does not exist until the first run has produced it.
          cache: false

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Point gomobile at the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Resolve modules
        working-directory: core
        run: |
          set -eux
          go mod tidy
          go mod download

      - name: Install gomobile
        env:
          MOBILE: golang.org/x/mobile
          REV: v0.0.0-20260908204917-8b95e45f8d3e
        run: |
          set -eux
          go install "$MOBILE/cmd/gomobile@$REV"
          go install "$MOBILE/cmd/gobind@$REV"
          gomobile init

      - name: Bind AAR
        working-directory: core
        env:
          # foss drops the non-free bits, with_gvisor is the userspace network
          # stack the tunnel runs on, cmfa enables mihomo's Android hooks —
          # the socket protection this app depends on.
          TAGS: foss,with_gvisor,cmfa
        run: |
          set -eux
          mkdir -p ../app/libs
          gomobile bind \
            -target=android/arm64 \
            -androidapi 26 \
            -javapkg=dev.zephyr \
            -tags "$TAGS" \
            -trimpath \
            -ldflags="-s -w" \
            -o ../app/libs/zephyrcore.aar \
            .
          ls -la ../app/libs

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: zephyrcore-aar
          path: app/libs/zephyrcore.aar
          if-no-files-found: error
          retention-days: 7

      # Committing these back pins every transitive Go dependency by hash.
      - name: Upload resolved module pins
        uses: actions/upload-artifact@v7
        with:
          name: go-pins
          path: |
            core/go.mod
            core/go.sum
          retention-days: 7

  apk:
    name: APK
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: "9.7.1"

      - name: Download core
        uses: actions/download-artifact@v8
        with:
          name: zephyrcore-aar
          path: app/libs

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZEPHYR_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ZEPHYR_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secret configured; the APK gets a debug signature."
          fi

      - name: Build
        env:
          ZEPHYR_KEYSTORE_PASSWORD: ${{ secrets.ZEPHYR_KEYSTORE_PASSWORD }}
          ZEPHYR_KEY_ALIAS: ${{ secrets.ZEPHYR_KEY_ALIAS }}
          ZEPHYR_KEY_PASSWORD: ${{ secrets.ZEPHYR_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        id: name
        run: |
          set -eu
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$src"
          out="Zephyr-$(date -u +%y.%m.%d)-arm64.apk"
          cp "$src" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          ls -la "$out"

      # archive:false stores the file as-is, so it downloads as an installer
      # rather than a zip that has to be unpacked first.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}
          if-no-files-found: error
          archive: false
          retention-days: 30
